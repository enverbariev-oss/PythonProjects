<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хрючево — ИИ Шеф</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand { font-weight: 800; letter-spacing: 1px; }
        .nav-link:hover { color: #ffc107 !important; }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">👨‍🍳 ХРЮЧЕВО</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Главная</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                            Выбрать кухню
                        </a>
                        <ul class="dropdown-menu shadow border-0">
                            {% for cat in all_categories %}
                            <li>
                                <a class="dropdown-item" href="{{ url_for('category_detail', category_id=cat.id) }}">
                                    {{ cat.name }}
                                </a>
                            </li>
                            {% endfor %}
                        </ul>
                    </li>
                </ul>

                <a href="/admin" class="btn btn-outline-warning btn-sm">Админка</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function getAISuggestion() {
    const input = document.getElementById('moodInput');
    const query = input ? input.value : "";

    if (!query) {
        alert("Введите название блюда или ингредиент!");
        return;
    }

    fetch('/api/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query: query})
    })
    .then(response => response.json())
    .then(data => {
        const div = document.getElementById('aiResponse');
        if(data.success) {
            document.getElementById('aiDishName').innerText = "✨ " + data.name;
            document.getElementById('aiDishDesc').innerText = data.desc;
            document.getElementById('aiGoToRecipe').setAttribute('href', "/recipe/" + data.id);
            div.classList.remove('d-none');
        } else {
            alert("Ничего не нашли. Попробуйте: 'Борщ', 'Паста' или 'Суши'");
        }
    })
    .catch(err => {
        console.error("Ошибка:", err);
        alert("Произошла ошибка при поиске.");
    });
}
</script>
</body>
</html>
